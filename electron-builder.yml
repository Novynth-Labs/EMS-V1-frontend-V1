appId: com.novynthlabs.novynthworkflow
productName: Novynth Workflow
copyright: Copyright © 2026 Novynth Labs Pvt Ltd

directories:
  output: dist-electron
  buildResources: build

files:
  - dist/**/*
  - electron/**/*
  - package.json

publish:
  provider: github
  owner: Tejaspadaki
  repo: EMS-V1-frontend-V1

extraMetadata:
  author:
    name: Novynth Labs Pvt Ltd
    email: novynthlabs@gmail.com
  companyName: Novynth Labs Pvt Ltd
  maintainer: Novynth Labs Pvt Ltd <novynthlabs@gmail.com>

win:
  executableName: novynth-workflow
  icon: build/icon.ico
  publisherName: Novynth Labs Pvt Ltd
  legalTrademarks: Novynth Labs Pvt Ltd
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: "Novynth Workflow"
  runAfterFinish: true
  artifactName: "Novynth-Workflow-Setup-${version}.${ext}"

portable:
  artifactName: "Novynth-Workflow-Portable-${version}.${ext}"

linux:
  executableName: novynth-workflow
  icon: build/icon.png
  category: Office
  maintainer: "Novynth Labs Pvt Ltd <novynthlabs@gmail.com>"
  synopsis: Novynth Workflow Desktop Application
  desktop:
    Name: Novynth Workflow
    Comment: Novynth Workflow Desktop Application
    Exec: novynth-workflow %U --no-sandbox
    Terminal: false
    Type: Application
    Icon: novynth-workflow
    StartupWMClass: novynth-workflow
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: "Novynth-Workflow-${version}.${ext}"

deb:
  artifactName: "Novynth-Workflow_${version}_amd64.${ext}"
