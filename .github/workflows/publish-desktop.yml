name: Build & Publish Novynth Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build & Verify Windows Production Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract package version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci

      - name: Generate Icons & Build Frontend
        run: |
          node scripts/generate-icons.cjs
          npm run build

      - name: Build Windows Installer (electron-builder)
        run: |
          npm run electron:prepare-cache
          npx electron-builder --win --x64 --publish never
          node scripts/organize-dist.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Windows Installer Binary & latest.yml Integrity
        run: node scripts/verify-exe.cjs

      - name: Publish Windows Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Novynth Workflow Desktop v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist-electron/*.exe
            dist-electron/*.blockmap
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux-release:
    name: Build & Verify Linux Production Release
    needs: build-windows-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Extract package version
        id: pkg
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Install System Dependencies for Linux Build
        run: |
          sudo apt-get update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libopenjp2-7-dev libssl-dev rpm libfuse2

      - name: Install Dependencies
        run: npm ci

      - name: Generate Icons & Build Frontend
        run: |
          node scripts/generate-icons.cjs
          npm run build

      - name: Build Linux AppImage (electron-builder)
        run: |
          npx electron-builder --linux --x64 --publish never
          node scripts/organize-dist.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Linux AppImage Binary Size
        run: |
          APPIMAGE_PATH=$(find dist-electron -type f -name "*.AppImage" | head -n 1)
          if [ -z "$APPIMAGE_PATH" ] || [ ! -f "$APPIMAGE_PATH" ]; then
            echo "❌ CRITICAL: Linux AppImage binary not found in dist-electron/"
            ls -la dist-electron/ || true
            exit 1
          fi
          echo "Found Linux AppImage: $APPIMAGE_PATH"
          SIZE=$(stat -c%s "$APPIMAGE_PATH")
          echo "Linux AppImage Size: $SIZE bytes"
          if [ "$SIZE" -lt 20000000 ]; then
            echo "❌ CRITICAL: Linux AppImage is less than 20MB! Truncated build detected."
            exit 1
          fi
          echo "✅ Linux AppImage verification passed successfully!"

      - name: Publish Linux Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          name: Novynth Workflow Desktop v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
          files: |
            dist-electron/*.AppImage
            dist-electron/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
